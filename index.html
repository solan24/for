<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Happy Monthsary</title>
<style>
*{box-sizing:border-box}
html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:#030509;
  font-family:'Courier New',monospace;
}
body{touch-action:manipulation}
canvas{
  display:block;
  width:100%;
  height:100%;
  background:#030509;
}
#startScreen{
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  background:#030509;
  color:#ff4d88;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:1.4rem;
  text-align:center;
  padding:20px;
  cursor:pointer;
  z-index:10;
  text-shadow:0 0 15px #ff4d88;
}
</style>
</head>
<body>
<div id="startScreen">Tap anywhere to start ✨</div>
<canvas id="loveCanvas"></canvas>

<audio id="bgMusic" loop preload="auto">
  <source src="https://assets.mixkit.co/music/preview/mixkit-romantic-acoustic-guitar-74.mp3" type="audio/mpeg">
</audio>

<script>
(() => {
"use strict";

const canvas = document.getElementById("loveCanvas");
const ctx = canvas.getContext("2d", {alpha:false});
const music = document.getElementById("bgMusic");
const startScreen = document.getElementById("startScreen");

let W=0,H=0,DPR=1;
let start=0;
let last=0;

/* ---------- timeline (seconds) ---------- */
/* extra anniversary lines added after "Love", loop length updated to match */
const timeline=[
  [0,2,""],
  [2,4,"3"],
  [4,6,"2"],
  [6,8,"1"],
  [8,10,"You"],
  [10,12,"Are"],
  [12,14,"My"],
  [14,16,"Love"],
  [16,18,""],
  [18,20,"And"],
  [20,22,"Happy"],
  [22,24,"2nd"],
  [24,26,"Anniversary"],
  [26,28,"To My"],
  [28,30,"Lady Don"],
  [30,32,""],
  [32,43.2,"HEART"]
];
const LOOP_LENGTH = 43.2;

const pink="#ff4d88";

/* ---------- simple matrix rain (classic single-char columns) ---------- */
const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*<>/|{}[]";
let fontSize = 16;
let columns = 0;
let drops = [];

function rand(a,b){return a+Math.random()*(b-a);}
function easeOutCubic(t){return 1-Math.pow(1-t,3);}
function easeInCubic(t){return t*t*t;}
function easeInOutCubic(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }

/* Slow, graceful burst-out -> pause fully vanished -> slow reform -> long hold together.
   Returns 0 (fully formed) to 1 (fully scattered). Tuned to feel unhurried, not snappy. */
function burstFactor(local, period){
  const p = (local % period) / period;
  if(p < 0.35) return easeInOutCubic(p/0.35);                    // slow drift outward
  if(p < 0.45) return 1;                                          // brief pause, fully vanished
  if(p < 0.75) return 1 - easeInOutCubic((p-0.45)/0.30);          // slow graceful reform
  return 0;                                                       // long hold, message reads clearly
}

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W*DPR);
  canvas.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);

  fontSize = Math.max(14, Math.min(20, W/45));
  columns = Math.ceil(W/fontSize);
  drops = new Array(columns).fill(0).map(()=>rand(-H/fontSize, 0));

  buildHeart();
  dotCache.clear();
}
window.addEventListener("resize", resize, {passive:true});

function drawRain(){
  // classic look: solid pink glyphs, soft fade trail, straight from your reference file
  ctx.fillStyle = "rgba(3,5,9,0.12)";
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle = pink;
  ctx.font = fontSize+"px monospace";

  for(let i=0;i<drops.length;i++){
    const text = chars.charAt(Math.floor(Math.random()*chars.length));
    ctx.fillText(text, i*fontSize, drops[i]*fontSize);

    if(drops[i]*fontSize > H && Math.random() > 0.975){
      drops[i] = 0;
    }
    drops[i]++;
  }
}

/* ---------- dot-matrix text, with clear burst-out / reform while displayed ---------- */
const dotCache = new Map();

function makeDotText(text){
  if(dotCache.has(text)) return dotCache.get(text);

  let fontSizeText;
  if(text==="3"||text==="2"||text==="1") fontSizeText = Math.min(W*.32,H*.30);
  else if(text.length>10) fontSizeText = Math.min(W*.16,H*.16);
  else if(text.length>5) fontSizeText = Math.min(W*.19,H*.19);
  else fontSizeText = Math.min(W*.25,H*.22);

  const off=document.createElement("canvas");
  const oc=off.getContext("2d");
  oc.font=`900 ${fontSizeText}px "Arial Black","Courier New",monospace`;
  const m=oc.measureText(text);
  const pad=fontSizeText*.18;

  off.width=Math.ceil(m.width+pad*2);
  off.height=Math.ceil(fontSizeText*1.25+pad*2);

  oc.clearRect(0,0,off.width,off.height);
  oc.fillStyle="#fff";
  oc.font=`900 ${fontSizeText}px "Arial Black","Courier New",monospace`;
  oc.textAlign="center";
  oc.textBaseline="middle";
  oc.fillText(text,off.width/2,off.height/2);

  const pixels=oc.getImageData(0,0,off.width,off.height).data;
  const step=Math.max(3,Math.round(fontSizeText/25));
  const dots=[];

  for(let y=0;y<off.height;y+=step){
    for(let x=0;x<off.width;x+=step){
      const a=pixels[(y*off.width+x)*4+3];
      if(a>100){
        const dx = x-off.width/2;
        const dy = y-off.height/2;
        const dist = Math.hypot(dx,dy) || 1;
        dots.push({
          x:dx, y:dy,
          r:step*.36,
          phase:Math.random()*Math.PI*2,
          // direction away from the text's own center, for the burst
          dirX: dx/dist, dirY: dy/dist,
          burstDist: rand(90,200) * (0.5 + dist/Math.max(off.width,off.height))
        });
      }
    }
  }

  const result={dots};
  dotCache.set(text,result);
  return result;
}

function drawDotText(text, elapsed, local, duration){
  const data = makeDotText(text);

  const fadeIn = Math.min(1, local/.14);
  const fadeOut = Math.min(1, (duration-local)/.14);
  const alpha = Math.max(0, Math.min(fadeIn, fadeOut));

  // burst cycle kicks in once the text has fully appeared, so the first form-up looks clean
  const burst = local < 0.4 ? 0 : burstFactor(local - 0.4, 2.0);
  const dip = Math.max(0, 1 - burst*1.3); // fully vanishes at peak burst, then fades back in as it reforms

  ctx.save();
  ctx.translate(W/2, H/2);

  for(const d of data.dots){
    const shimmer = .88+.12*Math.sin(elapsed*8+d.phase);
    const a = alpha*shimmer*dip;

    const x = d.x + d.dirX * d.burstDist * burst;
    const y = d.y + d.dirY * d.burstDist * burst;

    ctx.beginPath();
    ctx.arc(x,y,d.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,251,217,${a})`;
    ctx.shadowColor=`rgba(255,247,205,${a*.7})`;
    ctx.shadowBlur=5;
    ctx.fill();
  }
  ctx.restore();
}

/* ---------- pixel heart, same clear burst-out / reform treatment ---------- */
let heart=[];
function buildHeart(){
  heart=[];
  const s=Math.min(W,H)*(W<600?.255:.285);
  const cx=W/2, cy=H*.485;

  function add(x,y,r){
    const dx=x-cx, dy=y-cy;
    const dist=Math.hypot(dx,dy)||1;
    heart.push({
      x,y,
      r:r||rand(1.0,2.7),
      a:rand(.48,.98),
      phase:rand(0,Math.PI*2),
      dirX:dx/dist, dirY:dy/dist,
      burstDist: rand(80,180) * (0.6 + dist/s)
    });
  }

  for(let t=0;t<Math.PI*2;t+=.009){
    const x=16*Math.pow(Math.sin(t),3);
    const y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
    const px=cx+x*s/16, py=cy-y*s/16;
    add(px+rand(-2.5,2.5),py+rand(-2.5,2.5),rand(1.15,2.9));
    if(Math.random()<.55) add(px+rand(-5,5),py+rand(-5,5),rand(.8,2.2));
  }
  for(let i=0;i<260;i++){
    const t=rand(0,Math.PI*2);
    const x=16*Math.pow(Math.sin(t),3);
    const y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
    add(
      cx+x*s/16*rand(.94,1.03)+rand(-8,8),
      cy-y*s/16*rand(.94,1.03)+rand(-8,8),
      rand(.7,2.0)
    );
  }
}

function drawHeart(elapsed, local){
  if(!heart.length) buildHeart();

  const appear = Math.min(1, local/.85);
  const pulse = 1+.018*Math.sin(elapsed*5.2);
  const burst = local < 0.9 ? 0 : burstFactor(local - 0.9, 5.0);
  const dip = Math.max(0, 1 - burst*1.3); // fully vanishes at peak burst, then fades back in as it reforms

  ctx.save();
  ctx.translate(W/2,H*.485);
  ctx.scale(pulse,pulse);
  ctx.translate(-W/2,-H*.485);

  for(const p of heart){
    const tw=.72+.28*Math.sin(elapsed*7+p.phase);
    const a=p.a*tw*appear*dip;

    const x = p.x + p.dirX * p.burstDist * burst;
    const y = p.y + p.dirY * p.burstDist * burst;

    ctx.beginPath();
    ctx.arc(x,y,p.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,77,136,${a})`;
    ctx.shadowColor=`rgba(255,70,130,${a*.72})`;
    ctx.shadowBlur=7;
    ctx.fill();
  }
  ctx.restore();

  const size=Math.max(9,Math.min(16,W*.033));
  const textAlpha = appear * Math.max(0, 1 - burst*1.3);
  ctx.save();
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.font=`bold ${size}px "Courier New",monospace`;
  ctx.fillStyle=`rgba(255,235,215,${textAlpha})`;
  ctx.shadowColor=`rgba(255,77,136,.95)`;
  ctx.shadowBlur=9;
  ctx.fillText("I Love ❤️ You gundii", W/2, H*.485);
  ctx.restore();
}

function getStage(t){
  for(const s of timeline) if(t>=s[0] && t<s[1]) return s;
  return timeline[timeline.length-1];
}

function animate(now){
  const dt=Math.min(.04,(now-last)/1000);
  last=now;

  const elapsed=((now-start)/1000)%LOOP_LENGTH;

  drawRain();

  const stage=getStage(elapsed);
  const duration = stage[1]-stage[0];
  if(stage[2]==="HEART"){
    drawHeart(elapsed, elapsed-stage[0]);
  }else if(stage[2]){
    drawDotText(stage[2], elapsed, elapsed-stage[0], duration);
  }

  requestAnimationFrame(animate);
}

resize();
ctx.fillStyle="#030509";
ctx.fillRect(0,0,W,H);

/* ---------- soft music: gentle fade-in, lower resting volume ---------- */
function fadeInMusic(targetVolume, durationMs){
  music.volume = 0;
  const steps = 30;
  const stepTime = durationMs/steps;
  let i = 0;
  const iv = setInterval(()=>{
    i++;
    music.volume = Math.min(targetVolume, (targetVolume*i)/steps);
    if(i>=steps) clearInterval(iv);
  }, stepTime);
}

startScreen.addEventListener("click", () => {
  startScreen.style.display="none";
  music.volume = 0;
  music.play().then(()=>{
    fadeInMusic(0.4, 2500); // soft, gentle volume rather than blasting in at full
  }).catch(()=>{});
  start=performance.now();
  last=start;
  requestAnimationFrame(animate);
}, {once:true});

})();
</script>
</body>
</html>
