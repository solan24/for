<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Little Garden 🌸🦋</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #11152f;
}


/* =====================================================
   NIGHT SKY
===================================================== */

.night {
    position: fixed;
    inset: 0;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 30%,
            rgba(255, 190, 225, .12),
            transparent 30%
        ),
        linear-gradient(
            to bottom,
            #0b1030,
            #171c42 45%,
            #293052 70%,
            #15372e
        );
}


/* =====================================================
   MOON
===================================================== */

.moon {
    position: absolute;

    width: 95px;
    height: 95px;

    top: 8%;
    right: 10%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fffde3,
            #fff0b5
        );

    box-shadow:
        0 0 30px rgba(255,245,190,.8),
        0 0 80px rgba(255,235,160,.3);

    animation:
        moonGlow
        4s
        ease-in-out
        infinite
        alternate;
}

@keyframes moonGlow {

    from {
        transform: scale(.98);
    }

    to {
        transform: scale(1.04);
    }
}


/* =====================================================
   STARS
===================================================== */

.star {
    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 8px white;

    animation:
        twinkle
        var(--time)
        ease-in-out
        infinite;
}

@keyframes twinkle {

    0%,
    100% {
        opacity: .2;
        transform: scale(.5);
    }

    50% {
        opacity: 1;
        transform: scale(1.5);
    }
}


/* =====================================================
   CLOUDS
===================================================== */

.cloud {
    position: absolute;

    width: 150px;
    height: 30px;

    border-radius: 50px;

    background:
        rgba(255,255,255,.035);

    filter: blur(2px);

    animation:
        cloudMove
        40s
        linear
        infinite;
}

.cloud::before,
.cloud::after {
    content: "";

    position: absolute;

    background: inherit;

    border-radius: 50%;
}

.cloud::before {
    width: 65px;
    height: 65px;

    left: 20px;
    bottom: 2px;
}

.cloud::after {
    width: 55px;
    height: 55px;

    right: 20px;
    bottom: 2px;
}

.cloud.one {
    top: 24%;
    left: -200px;
}

.cloud.two {
    top: 38%;
    left: -350px;

    transform: scale(.7);

    animation-delay: 12s;
}

@keyframes cloudMove {

    from {
        transform: translateX(0);
    }

    to {
        transform:
            translateX(calc(100vw + 500px));
    }
}


/* =====================================================
   GARDEN
===================================================== */

.garden {
    position: relative;

    width: 100%;
    height: 100%;
}


/* =====================================================
   GROUND
===================================================== */

.ground {
    position: absolute;

    left: -5%;
    bottom: -12%;

    width: 110%;
    height: 30%;

    border-radius:
        50% 50% 0 0;

    background:
        radial-gradient(
            ellipse at top,
            #397153,
            #194736 55%,
            #0e2d25
        );

    box-shadow:
        0 -15px 40px rgba(0,0,0,.35);
}


/* =====================================================
   FLOWERS
===================================================== */

.flowers {
    position: absolute;

    left: 0;
    bottom: 5%;

    width: 100%;
    height: 78%;

    z-index: 15;
}


/* =====================================================
   FLOWER
===================================================== */

.flower {
    position: absolute;

    bottom: 0;

    width: 140px;
    height: 430px;

    transform-origin: bottom center;

    animation:
        flowerSway
        4s
        ease-in-out
        infinite;
}

@keyframes flowerSway {

    0%,
    100% {
        rotate: 2deg;
    }

    50% {
        rotate: -3deg;
    }
}


/* =====================================================
   FLOWER POSITIONS
===================================================== */

.flower:nth-child(1) {
    left: 0%;
    transform: scale(.45);
}

.flower:nth-child(2) {
    left: 10%;
    transform: scale(.65);
}

.flower:nth-child(3) {
    left: 22%;
    transform: scale(.48);
}

.flower:nth-child(4) {
    left: 33%;
    transform: scale(.82);
}

.flower:nth-child(5) {
    left: 46%;
    transform: scale(.63);
}

.flower:nth-child(6) {
    left: 58%;
    transform: scale(.76);
}

.flower:nth-child(7) {
    left: 70%;
    transform: scale(.50);
}

.flower:nth-child(8) {
    right: 7%;
    transform: scale(.68);
}

.flower:nth-child(9) {
    right: -2%;
    transform: scale(.45);
}


/* =====================================================
   STEM
===================================================== */

.stem {
    position: absolute;

    left: 50%;
    bottom: 0;

    width: 9px;
    height: 78%;

    border-radius: 20px;

    background:
        linear-gradient(
            to right,
            #125737,
            #5ab273,
            #125737
        );

    transform:
        translateX(-50%)
        scaleY(0);

    transform-origin: bottom;

    animation:
        growStem
        1.8s
        var(--stem-delay)
        ease-out
        forwards;
}

@keyframes growStem {

    to {
        transform:
            translateX(-50%)
            scaleY(1);
    }
}


/* =====================================================
   LEAVES
===================================================== */

.leaf {
    position: absolute;

    width: 70px;
    height: 32px;

    background:
        linear-gradient(
            135deg,
            #68ca82,
            #167143
        );

    border-radius:
        100% 0 100% 0;

    transform: scale(0);

    animation:
        leafGrow
        1s
        var(--leaf-delay)
        cubic-bezier(.2,1.5,.5,1)
        forwards;
}

.leaf-left {
    left: 18%;
    bottom: 38%;
}

.leaf-right {
    right: 18%;
    bottom: 50%;
}

@keyframes leafGrow {

    to {
        transform:
            rotate(-35deg)
            scale(1);
    }
}


/* =====================================================
   FLOWER HEAD
===================================================== */

.flower-head {
    position: absolute;

    left: 50%;
    top: 9%;

    width: 135px;
    height: 135px;

    transform:
        translateX(-50%)
        scale(0);

    animation:
        bloom
        1.6s
        var(--bloom-delay)
        cubic-bezier(.15,1.5,.4,1)
        forwards;
}

@keyframes bloom {

    0% {
        transform:
            translateX(-50%)
            scale(0)
            rotate(-30deg);

        opacity: 0;

        filter: blur(5px);
    }

    60% {
        transform:
            translateX(-50%)
            scale(1.15)
            rotate(8deg);

        opacity: 1;

        filter: blur(0);
    }

    80% {
        transform:
            translateX(-50%)
            scale(.94)
            rotate(-3deg);
    }

    100% {
        transform:
            translateX(-50%)
            scale(1)
            rotate(0);
    }
}


/* =====================================================
   PETALS
===================================================== */

.petal {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 57px;
    height: 78px;

    border-radius:
        50% 50% 45% 45%;

    transform-origin:
        50% 100%;

    box-shadow:
        inset 0 -5px 10px rgba(255,255,255,.3),
        0 0 15px rgba(255,170,210,.2);
}


/* Seven petals */

.p1 {
    transform:
        translate(-50%,-100%)
        rotate(0deg);
}

.p2 {
    transform:
        translate(-50%,-100%)
        rotate(51deg);
}

.p3 {
    transform:
        translate(-50%,-100%)
        rotate(102deg);
}

.p4 {
    transform:
        translate(-50%,-100%)
        rotate(153deg);
}

.p5 {
    transform:
        translate(-50%,-100%)
        rotate(204deg);
}

.p6 {
    transform:
        translate(-50%,-100%)
        rotate(255deg);
}

.p7 {
    transform:
        translate(-50%,-100%)
        rotate(306deg);
}


/* =====================================================
   FLOWER COLORS
===================================================== */

.pink .petal {
    background:
        linear-gradient(
            135deg,
            #ffd8eb,
            #ff6fae
        );
}

.purple .petal {
    background:
        linear-gradient(
            135deg,
            #efdfff,
            #a473ff
        );
}

.blue .petal {
    background:
        linear-gradient(
            135deg,
            #d4faff,
            #6bdce9
        );
}

.yellow .petal {
    background:
        linear-gradient(
            135deg,
            #fff9b8,
            #ffc84a
        );
}


/* =====================================================
   FLOWER CENTER
===================================================== */

.center {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 40px;
    height: 40px;

    border-radius: 50%;

    transform:
        translate(-50%,-50%);

    background:
        radial-gradient(
            circle,
            #fffbd5 0 25%,
            #ffd04d 26% 100%
        );

    box-shadow:
        0 0 12px #ffd45a,
        0 0 30px rgba(255,210,70,.6);

    z-index: 10;

    animation:
        centerPulse
        2s
        ease-in-out
        infinite
        alternate;
}

@keyframes centerPulse {

    from {
        box-shadow:
            0 0 8px #ffd45a;
    }

    to {
        box-shadow:
            0 0 30px #ffd45a,
            0 0 50px rgba(255,210,70,.25);
    }
}


/* =====================================================
   BLOOM TIMING
===================================================== */

.flower:nth-child(1) {
    --stem-delay: .2s;
    --leaf-delay: 1.2s;
    --bloom-delay: 1.4s;
}

.flower:nth-child(2) {
    --stem-delay: .5s;
    --leaf-delay: 1.5s;
    --bloom-delay: 1.7s;
}

.flower:nth-child(3) {
    --stem-delay: .8s;
    --leaf-delay: 1.8s;
    --bloom-delay: 2s;
}

.flower:nth-child(4) {
    --stem-delay: 1.1s;
    --leaf-delay: 2.1s;
    --bloom-delay: 2.3s;
}

.flower:nth-child(5) {
    --stem-delay: 1.4s;
    --leaf-delay: 2.4s;
    --bloom-delay: 2.6s;
}

.flower:nth-child(6) {
    --stem-delay: 1.7s;
    --leaf-delay: 2.7s;
    --bloom-delay: 2.9s;
}

.flower:nth-child(7) {
    --stem-delay: 2s;
    --leaf-delay: 3s;
    --bloom-delay: 3.2s;
}

.flower:nth-child(8) {
    --stem-delay: 2.3s;
    --leaf-delay: 3.3s;
    --bloom-delay: 3.5s;
}

.flower:nth-child(9) {
    --stem-delay: 2.6s;
    --leaf-delay: 3.6s;
    --bloom-delay: 3.8s;
}


/* =====================================================
   REAL BUTTERFLY
===================================================== */

.butterfly {
    position: absolute;

    width: 95px;

    z-index: 60;

    pointer-events: none;

    will-change:
        transform,
        left,
        top;

    animation:
        butterflyFlight
        18s
        ease-in-out
        infinite;
}


/*
   The actual butterfly image.

   Put butterfly-blue.png beside index.html.
*/

.butterfly img {
    display: block;

    width: 100%;
    height: auto;

    object-fit: contain;

    filter:
        drop-shadow(
            0 5px 8px
            rgba(0,0,0,.22)
        );

    transform-origin:
        center center;

    animation:
        wingMotion
        .65s
        ease-in-out
        infinite
        alternate;
}


/* =====================================================
   REALISTIC WING MOVEMENT
===================================================== */

@keyframes wingMotion {

    0% {
        transform:
            perspective(500px)
            rotateY(0deg)
            rotateZ(-2deg);
    }

    50% {
        transform:
            perspective(500px)
            rotateY(18deg)
            rotateZ(2deg);
    }

    100% {
        transform:
            perspective(500px)
            rotateY(-12deg)
            rotateZ(-2deg);
    }
}


/* =====================================================
   BUTTERFLY FLIGHT
===================================================== */

.butterfly.one {
    width: 105px;

    left: -12%;
    top: 52%;

    animation-delay: 0s;
}

.butterfly.two {
    width: 70px;

    left: -15%;
    top: 30%;

    animation-delay: 6s;

    opacity: .9;
}

.butterfly.three {
    width: 82px;

    left: -10%;
    top: 65%;

    animation-delay: 11s;

    opacity: .85;
}


@keyframes butterflyFlight {

    0% {
        left: -12%;
        top: 55%;

        transform:
            rotate(8deg)
            translateY(0);
    }

    12% {
        left: 8%;
        top: 38%;

        transform:
            rotate(-8deg)
            translateY(-15px);
    }

    25% {
        left: 22%;
        top: 47%;

        transform:
            rotate(10deg)
            translateY(10px);
    }

    38% {
        left: 35%;
        top: 29%;

        transform:
            rotate(-8deg)
            translateY(-12px);
    }

    50% {
        left: 49%;
        top: 42%;

        transform:
            rotate(7deg)
            translateY(8px);
    }

    62% {
        left: 62%;
        top: 28%;

        transform:
            rotate(-8deg)
            translateY(-15px);
    }

    74% {
        left: 74%;
        top: 44%;

        transform:
            rotate(8deg)
            translateY(10px);
    }

    87% {
        left: 88%;
        top: 30%;

        transform:
            rotate(-7deg)
            translateY(-10px);
    }

    100% {
        left: 110%;
        top: 46%;

        transform:
            rotate(8deg)
            translateY(0);
    }
}


/* =====================================================
   BUTTERFLY LANDING FEEL
===================================================== */

.butterfly.one img {
    animation-duration: .7s;
}

.butterfly.two img {
    animation-duration: .8s;
}

.butterfly.three img {
    animation-duration: .6s;
}


/* =====================================================
   FIREFLIES
===================================================== */

.firefly {
    position: absolute;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: #fff6a8;

    box-shadow:
        0 0 8px #fff6a8,
        0 0 18px #fff6a8;

    animation:
        firefly
        6s
        linear
        infinite;
}

@keyframes firefly {

    0% {
        opacity: 0;

        transform:
            translate(0,20px);
    }

    20% {
        opacity: 1;
    }

    50% {
        transform:
            translate(40px,-45px);
    }

    80% {
        opacity: 1;
    }

    100% {
        opacity: 0;

        transform:
            translate(-20px,-100px);
    }
}


/* =====================================================
   FLOATING HEARTS
===================================================== */

.heart {
    position: absolute;

    z-index: 50;

    color: #ff9fc9;

    font-size: 18px;

    opacity: 0;

    animation:
        heartFloat
        6s
        linear
        infinite;
}

.heart.one {
    left: 15%;
    bottom: 18%;
}

.heart.two {
    left: 70%;
    bottom: 20%;

    animation-delay: 2s;
}

.heart.three {
    left: 55%;
    bottom: 12%;

    animation-delay: 4s;
}

@keyframes heartFloat {

    0% {
        opacity: 0;

        transform:
            translateY(0)
            scale(.6);
    }

    20% {
        opacity: 1;
    }

    80% {
        opacity: .8;
    }

    100% {
        opacity: 0;

        transform:
            translateY(-160px)
            scale(1.3);
    }
}


/* =====================================================
   PANDA CARD
===================================================== */

.panda-card {
    position: absolute;

    z-index: 100;

    top: 11%;
    left: 50%;

    width: 235px;

    padding:
        17px
        15px
        18px;

    text-align: center;

    border-radius: 30px;

    background:
        rgba(255,255,255,.95);

    border:
        2px solid rgba(255,255,255,.7);

    box-shadow:
        0 20px 50px rgba(0,0,0,.28),
        0 0 35px rgba(255,180,220,.3);

    transform:
        translateX(-50%)
        scale(0);

    animation:
        cardShow
        1s
        4.5s
        cubic-bezier(.2,1.4,.5,1)
        forwards;
}

@keyframes cardShow {

    to {
        transform:
            translateX(-50%)
            scale(1);
    }
}


/* =====================================================
   PANDA
===================================================== */

.panda {
    position: relative;

    width: 115px;
    height: 100px;

    margin:
        0 auto
        8px;
}

.panda-head {
    position: absolute;

    left: 13px;
    top: 12px;

    width: 90px;
    height: 78px;

    border-radius:
        48% 48% 45% 45%;

    background: white;

    border:
        2px solid #eee;

    z-index: 4;
}

.ear {
    position: absolute;

    top: 0;

    width: 34px;
    height: 34px;

    border-radius: 50%;

    background: #202020;

    z-index: 2;
}

.ear.left {
    left: 4px;
}

.ear.right {
    right: 4px;
}

.eye-patch {
    position: absolute;

    top: 31px;

    width: 27px;
    height: 33px;

    border-radius: 50%;

    background: #222;
}

.eye-patch.left {
    left: 18px;
    transform: rotate(30deg);
}

.eye-patch.right {
    right: 18px;
    transform: rotate(-30deg);
}

.eye {
    position: absolute;

    top: 41px;

    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: white;

    z-index: 10;
}

.eye::after {
    content: "";

    position: absolute;

    left: 2px;
    top: 2px;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: #111;
}

.eye.left {
    left: 27px;
}

.eye.right {
    right: 27px;
}

.nose {
    position: absolute;

    left: 50%;
    top: 53px;

    width: 14px;
    height: 9px;

    transform:
        translateX(-50%);

    border-radius: 50%;

    background: #222;

    z-index: 10;
}

.mouth {
    position: absolute;

    left: 50%;
    top: 60px;

    width: 19px;
    height: 10px;

    transform:
        translateX(-50%);

    border-bottom:
        2px solid #222;

    border-radius: 50%;

    z-index: 10;
}

.blush {
    position: absolute;

    top: 55px;

    width: 16px;
    height: 8px;

    border-radius: 50%;

    background: #ffafc8;

    opacity: .8;
}

.blush.left {
    left: 10px;
}

.blush.right {
    right: 10px;
}

.panda-body {
    position: absolute;

    bottom: 0;
    left: 31px;

    width: 55px;
    height: 38px;

    border-radius:
        50% 50% 35% 35%;

    background: #222;
}

.panda-arm {
    position: absolute;

    bottom: 7px;

    width: 25px;
    height: 35px;

    border-radius: 50%;

    background: #222;

    z-index: 5;
}

.panda-arm.left {
    left: 17px;
    transform: rotate(30deg);
}

.panda-arm.right {
    right: 17px;
    transform: rotate(-30deg);
}


/* =====================================================
   NOTE
===================================================== */

.note {
    color: #514451;

    font-size: 14px;

    line-height: 1.55;
}

.note strong {
    display: block;

    margin-bottom: 4px;

    color: #e36b9d;

    font-size: 17px;
}

.little-heart {
    display: inline-block;

    color: #ff6fae;

    animation:
        heartbeat
        1.2s
        ease-in-out
        infinite;
}

@keyframes heartbeat {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.3);
    }
}


/* =====================================================
   LOADING
===================================================== */

.not-loaded .flower,
.not-loaded .panda-card {
    animation-play-state: paused;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .moon {
        width: 65px;
        height: 65px;

        top: 7%;
        right: 7%;
    }

    .panda-card {
        top: 7%;

        width: 205px;

        padding:
            12px
            10px
            14px;
    }

    .note {
        font-size: 13px;
    }

    .note strong {
        font-size: 15px;
    }

    .butterfly.one {
        width: 70px;
    }

    .butterfly.two {
        width: 52px;
    }

    .butterfly.three {
        width: 58px;
    }

    .flower:nth-child(1) {
        left: -15%;
        transform: scale(.34);
    }

    .flower:nth-child(2) {
        left: -3%;
        transform: scale(.43);
    }

    .flower:nth-child(3) {
        left: 17%;
        transform: scale(.32);
    }

    .flower:nth-child(4) {
        left: 26%;
        transform: scale(.52);
    }

    .flower:nth-child(5) {
        left: 43%;
        transform: scale(.42);
    }

    .flower:nth-child(6) {
        left: 56%;
        transform: scale(.49);
    }

    .flower:nth-child(7) {
        left: 72%;
        transform: scale(.32);
    }

    .flower:nth-child(8) {
        right: -3%;
        transform: scale(.43);
    }

    .flower:nth-child(9) {
        right: -17%;
        transform: scale(.31);
    }
}

</style>

</head>


<body class="not-loaded">


<!-- =====================================================
     NIGHT
===================================================== -->

<div class="night">

    <div class="moon"></div>

    <div class="cloud one"></div>
    <div class="cloud two"></div>

</div>


<!-- =====================================================
     GARDEN
===================================================== -->

<div class="garden">

    <div class="ground"></div>


    <!-- =================================================
         FIREFLIES
    ================================================== -->

    <div class="firefly"
         style="left:8%;top:50%;animation-delay:0s;">
    </div>

    <div class="firefly"
         style="left:18%;top:38%;animation-delay:1s;">
    </div>

    <div class="firefly"
         style="left:32%;top:52%;animation-delay:2s;">

<script>


/* =====================================================
   START
===================================================== */

window.addEventListener("load", () => {

    setTimeout(() => {

        document.body.classList.remove(
            "not-loaded"
        );

    }, 500);

});


/* =====================================================
   CREATE STARS
===================================================== */

const night =
    document.querySelector(".night");

for (let i = 0; i < 80; i++) {

    const star =
        document.createElement("div");

    star.className = "star";

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 75 + "%";

    star.style.setProperty(
        "--time",
        2 + Math.random() * 4 + "s"
    );

    star.style.animationDelay =
        Math.random() * 4 + "s";

    night.appendChild(star);
}


/* =====================================================
   EXTRA FIREFLIES
===================================================== */

const garden =
    document.querySelector(".garden");

for (let i = 0; i < 12; i++) {

    const light =
        document.createElement("div");

    light.className =
        "firefly";

    light.style.left =
        Math.random() * 95 + "%";

    light.style.top =
        30 + Math.random() * 40 + "%";

    light.style.animationDelay =
        Math.random() * 6 + "s";

    garden.appendChild(light);
}


/* =====================================================
   CLICK SPARKLES
===================================================== */

document.addEventListener(
    "click",
    (event) => {

        for (let i = 0; i < 8; i++) {

            const sparkle =
                document.createElement("span");

            sparkle.style.position =
                "fixed";

            sparkle.style.left =
                event.clientX + "px";

            sparkle.style.top =
                event.clientY + "px";

            sparkle.style.width =
                "5px";

            sparkle.style.height =
                "5px";

            sparkle.style.borderRadius =
                "50%";

            sparkle.style.background =
                "#ffd7ed";

            sparkle.style.boxShadow =
                "0 0 12px white";

            sparkle.style.pointerEvents =
                "none";

            sparkle.style.zIndex =
                "9999";

            const angle =
                Math.random() *
                Math.PI *
                2;

            const distance =
                30 +
                Math.random() * 70;

            const x =
                Math.cos(angle) *
                distance;

            const y =
                Math.sin(angle) *
                distance;

            sparkle.animate(

                [
                    {
                        transform:
                            "translate(0,0) scale(1)",

                        opacity: 1
                    },

                    {
                        transform:
                            `translate(${x}px,${y}px) scale(0)`,

                        opacity: 0
                    }
                ],

                {
                    duration:
                        700 +
                        Math.random() *
                        500,

                    easing:
                        "cubic-bezier(.2,.8,.4,1)"
                }

            );

            document.body.appendChild(
                sparkle
            );

            setTimeout(() => {

                sparkle.remove();

            }, 1400);

        }

    }
);

</script>
